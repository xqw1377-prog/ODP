<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080b12" />
  <meta name="description" content="ODP discovers credible crypto projects, matches them with the right humans, and distributes ownership on Solana." />
  <title>Open Distribution Protocol</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand-lockup" href="/radar" aria-label="Open Distribution Protocol home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-copy"><b>ODP</b><small>Open Distribution Protocol</small></span>
    </a>
    <nav id="steps" aria-label="Protocol journey">
      <span data-step="discover"><b>01</b> Discover</span><i></i>
      <span data-step="trust"><b>02</b> Trust</span><i></i>
      <span data-step="match"><b>03</b> Match</span><i></i>
      <span data-step="distribute"><b>04</b> Distribute</span>
    </nav>
    <div class="network-chip"><i></i> Solana Devnet</div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="site-footer">
    <span class="footer-wordmark">ODP</span>
    <span>Evidence before distribution.</span>
    <span class="footer-spacer"></span>
    <span>Built on Solana</span>
    <span class="demo-wallet-badge" id="demo-badge" hidden>DEMO WALLET</span>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
