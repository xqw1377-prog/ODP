[package]
name = "distributor"
version = "0.1.0"
edition = "2021"
description = "ODP on-chain distributor: vault custody, immutable root commit, proof-verified claims, program-level double-claim rejection"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
solana-program = "2"

[profile.release]
overflow-checks = true

[dev-dependencies]
solana-program-test = "3"
solana-sdk = "3"
spl-token = { version = "9.0.0", default-features = false, features = ["no-entrypoint"] }
tokio = { version = "1", features = ["rt", "macros"] }
